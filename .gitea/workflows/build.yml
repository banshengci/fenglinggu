name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4
      - name: Export Windows
        shell: powershell
        run: |
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $godot --headless --path game --export-release "Windows Desktop" dist/fenglinggu_win.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  web:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4
      - name: Export Web
        shell: powershell
        run: |
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          New-Item -ItemType Directory -Force -Path dist/web | Out-Null
          & $godot --headless --path game --export-release "Web" dist/web/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web/
