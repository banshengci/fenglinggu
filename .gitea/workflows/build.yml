name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows
    steps:
      - name: Export Windows (local workspace)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "D:\xiangmu\youxi"
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          if (-not (Test-Path $godot)) { Write-Host "Godot not found: $godot"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $godot --headless --path game --export-release "Windows Desktop" dist/fenglinggu_win.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== ARTIFACTS ==="
          Get-ChildItem dist | Format-Table Name, Length

  web:
    runs-on: windows
    steps:
      - name: Export Web (local workspace)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "D:\xiangmu\youxi"
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          if (-not (Test-Path $godot)) { Write-Host "Godot not found: $godot"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist/web | Out-Null
          & $godot --headless --path game --export-release "Web" dist/web/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== ARTIFACTS ==="
          Get-ChildItem dist/web | Format-Table Name, Length
