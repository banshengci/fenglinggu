name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Export Windows
        run: |
          mkdir -p dist
          godot --headless --path game --export-release "Windows Desktop" dist/fenglinggu_win.exe
          ls -lh dist/

  web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Export Web
        run: |
          mkdir -p dist/web
          godot --headless --path game --export-release "Web" dist/web/index.html
          ls -lh dist/web/

  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Export Android APK
        run: |
          mkdir -p dist
          keytool -genkeypair -v -keystore dist/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FengLingGu Debug, OU=Dev, O=WindChime, L=NA, S=NA, C=CN"
          godot --headless --path game --export-release "Android" dist/fenglinggu.apk
          ls -lh dist/
