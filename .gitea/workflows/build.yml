name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows
    steps:
      - name: Export Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "D:\xiangmu\youxi"
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = @(
            "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe",
            "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $godot) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter "Godot*win64*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $godot = $found.FullName }
          }
          if (-not $godot) { Write-Host "Godot not found"; exit 1 }
          Write-Host "Using Godot: $godot"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $godot --headless --path game --export-release "Windows Desktop" dist/fenglinggu_win.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

  web:
    runs-on: windows
    steps:
      - name: Export Web
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "D:\xiangmu\youxi"
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = @(
            "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe",
            "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $godot) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter "Godot*win64*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $godot = $found.FullName }
          }
          if (-not $godot) { Write-Host "Godot not found"; exit 1 }
          Write-Host "Using Godot: $godot"
          New-Item -ItemType Directory -Force -Path dist/web | Out-Null
          & $godot --headless --path game --export-release "Web" dist/web/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/web | Format-Table Name, Length
