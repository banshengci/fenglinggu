name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never

jobs:
  windows:
    runs-on: windows
    steps:
      - name: Checkout and Export Windows
        shell: powershell
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          git config --global --add safe.directory '*'
          git config --global credential.helper ''
          if (Test-Path repo) { Remove-Item repo -Recurse -Force }
          git clone --depth 1 "http://oauth2:${TOKEN}@192.168.31.125:13000/banshengci/fenglinggu.git" repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location repo
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          if (-not (Test-Path $godot)) { Write-Host "Godot not found: $godot"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $godot --headless --path game --export-release "Windows Desktop" dist/fenglinggu_win.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "D:\xiangmu\youxi\dist" | Out-Null
          Copy-Item dist\* "D:\xiangmu\youxi\dist\" -Force
          Write-Host "=== ARTIFACTS ==="
          Get-ChildItem dist | Format-Table Name, Length
          Get-ChildItem "D:\xiangmu\youxi\dist" | Format-Table Name, Length

  web:
    runs-on: windows
    steps:
      - name: Checkout and Export Web
        shell: powershell
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          git config --global --add safe.directory '*'
          git config --global credential.helper ''
          if (Test-Path repo) { Remove-Item repo -Recurse -Force }
          git clone --depth 1 "http://oauth2:${TOKEN}@192.168.31.125:13000/banshengci/fenglinggu.git" repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location repo
          Write-Host "HEAD: $(git rev-parse --short HEAD)"
          $godot = "C:\Users\半生此\AppData\Local\Microsoft\WinGet\Packages\GodotEngine.GodotEngine_Microsoft.Winget.Source_8wekyb3d8bbwe\Godot_v4.7.2-stable_win64_console.exe"
          if (-not (Test-Path $godot)) { Write-Host "Godot not found: $godot"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist/web | Out-Null
          & $godot --headless --path game --export-release "Web" dist/web/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "D:\xiangmu\youxi\dist\web" | Out-Null
          Copy-Item dist\web\* "D:\xiangmu\youxi\dist\web\" -Force
          Write-Host "=== ARTIFACTS ==="
          Get-ChildItem dist/web | Format-Table Name, Length
