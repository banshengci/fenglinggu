name: build-0.01

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GAME_VERSION: "0.01"
  GODOT_VER: "4.3-stable"
  TPL_VER: "4.3.stable"

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Export Windows
        run: |
          mkdir -p dist
          godot --headless --path game --export-release "Windows Desktop" "dist/fenglinggu_win_${GAME_VERSION}.exe"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-win-${{ env.GAME_VERSION }}
          path: dist/

  linux:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Export Linux
        run: |
          mkdir -p dist
          godot --headless --path game --export-release "Linux" "dist/fenglinggu_linux_${GAME_VERSION}.x86_64"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-linux-${{ env.GAME_VERSION }}
          path: dist/

  web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Export Web
        run: |
          mkdir -p dist/web
          godot --headless --path game --export-release "Web" "dist/web/index.html"
          ls -lh dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-web-${{ env.GAME_VERSION }}
          path: dist/web/

  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK & install build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          mkdir -p dist
          keytool -genkeypair -v -keystore dist/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FengLingGu Debug, OU=Dev, O=WindChime, L=NA, S=NA, C=CN"
          # 写入 Godot Editor Settings（容器内）
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" load_steps=2 format=3]
          [ext_resource type="Script" path="res://addons/gut/editor_settings.gd" id="1"]
          [resource]
          export/android/debug_keystore = "dist/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "dist/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
      - name: Export Android APK
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$PWD/dist/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path game \
            --export-release "Android" "dist/fenglinggu_${GAME_VERSION}.apk" \
            --editor-pid 0 2>&1 | tee /tmp/godot-android.log || true
          # 若 keystore 环境变量不被识别，改 export preset 后重试
          if [ ! -f "dist/fenglinggu_${GAME_VERSION}.apk" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("game/export_presets.cfg")
          t = p.read_text(encoding="utf-8")
          keystore = str(Path("dist/debug.keystore").resolve())
          for key, val in {
              "keystore/debug": f'"{keystore}"',
              "keystore/debug_user": '"androiddebugkey"',
              "keystore/debug_password": '"android"',
              "keystore/release": f'"{keystore}"',
              "keystore/release_user": '"androiddebugkey"',
              "keystore/release_password": '"android"',
          }.items():
              import re
              if re.search(rf"^{re.escape(key)}=", t, re.M):
                  t = re.sub(rf"^{re.escape(key)}=.*$", f"{key}={val}", t, flags=re.M)
              else:
                  t = t.replace("[preset.3.options]", f"[preset.3.options]\n{key}={val}", 1)
          p.write_text(t, encoding="utf-8")
          PY
            godot --headless --path game --export-release "Android" "dist/fenglinggu_${GAME_VERSION}.apk"
          fi
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-android-${{ env.GAME_VERSION }}
          path: dist/
          if-no-files-found: error

  ios-xcodeproj:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + templates
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          echo "$GODOT_BIN" >> $GITHUB_PATH
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}/"
      - name: Export iOS Xcode project
        run: |
          mkdir -p dist/ios
          "$GODOT_BIN" --headless --path game --export-release "iOS" "dist/ios/fenglinggu.xcodeproj"
          cd dist/ios
          if [ -d fenglinggu.xcodeproj ] || [ -e fenglinggu.xcodeproj ]; then
            zip -qr "fenglinggu_ios_${GAME_VERSION}_xcode.zip" fenglinggu.xcodeproj || true
          fi
          echo "自签：Xcode Archive → Export Development 得 IPA，或 AltStore/Sideloadly 装 IPA"
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-ios-${{ env.GAME_VERSION }}-xcode
          path: dist/ios/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + templates
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}/"
      - name: Export macOS
        run: |
          mkdir -p dist
          "$GODOT_BIN" --headless --path game --export-release "macOS" "dist/fenglinggu_${GAME_VERSION}.zip"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-macos-${{ env.GAME_VERSION }}
          path: dist/
          if-no-files-found: ignore
