name: build-0.01

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GAME_VERSION: "0.01"
  GODOT_VER: "4.3-stable"
  TPL_VER: "4.3.stable"
  TPL_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install templates
        shell: bash
        run: |
          set -e
          command -v curl >/dev/null || apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip wget ca-certificates
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}" "$PWD/dist" "$PWD/game/dist"
          wget -q -O /tmp/tpl.tpz "$TPL_URL" || curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
          ls "$HOME/.local/share/godot/export_templates/${TPL_VER}/" | wc -l
      - name: Export Windows
        shell: bash
        run: |
          set -e
          OUT="$PWD/dist/fenglinggu_win_${GAME_VERSION}.exe"
          godot --headless --path "$PWD/game" --export-release "Windows Desktop" "$OUT"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-win-${{ env.GAME_VERSION }}
          path: dist/

  linux:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install templates
        shell: bash
        run: |
          set -e
          command -v curl >/dev/null || apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip wget ca-certificates
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}" "$PWD/dist"
          wget -q -O /tmp/tpl.tpz "$TPL_URL" || curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Export Linux
        shell: bash
        run: |
          set -e
          OUT="$PWD/dist/fenglinggu_linux_${GAME_VERSION}.x86_64"
          godot --headless --path "$PWD/game" --export-release "Linux" "$OUT"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-linux-${{ env.GAME_VERSION }}
          path: dist/

  web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install templates
        shell: bash
        run: |
          set -e
          command -v curl >/dev/null || apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl unzip wget ca-certificates
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}" "$PWD/dist/web"
          wget -q -O /tmp/tpl.tpz "$TPL_URL" || curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Export Web
        shell: bash
        run: |
          set -e
          OUT="$PWD/dist/web/index.html"
          godot --headless --path "$PWD/game" --export-release "Web" "$OUT"
          ls -lh "$PWD/dist/web/" | head
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-web-${{ env.GAME_VERSION }}
          path: dist/web/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK manually
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$PWD/dist"
          curl -L -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "$SDK/build-tools/33.0.2" >> $GITHUB_PATH
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-33" "build-tools;33.0.2" "platform-tools"
      - name: Install Godot + templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}" tools
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d tools
          GODOT_BIN="$(find "$PWD/tools" -type f -name 'Godot*' | head -1)"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          chmod +x "$GODOT_BIN"
          curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
      - name: Keystore and SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          keytool -genkeypair -v -keystore "$PWD/dist/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FengLingGu Debug, OU=Dev, O=WindChime, L=NA, S=NA, C=CN"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/debug_keystore = "$PWD/dist/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "$PWD/dist/debug.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("game/export_presets.cfg")
          t = p.read_text(encoding="utf-8")
          keystore = str(Path("dist/debug.keystore").resolve()).replace("\\", "/")
          for key, val in {
              "keystore/debug": f'"{keystore}"',
              "keystore/debug_user": '"androiddebugkey"',
              "keystore/debug_password": '"android"',
              "keystore/release": f'"{keystore}"',
              "keystore/release_user": '"androiddebugkey"',
              "keystore/release_password": '"android"',
          }.items():
              if re.search(rf"^{re.escape(key)}=", t, re.M):
                  t = re.sub(rf"^{re.escape(key)}=.*$", f"{key}={val}", t, flags=re.M)
              else:
                  t = t.replace("[preset.3.options]", f"[preset.3.options]\n{key}={val}", 1)
          p.write_text(t, encoding="utf-8")
          print("android preset patched")
          PY
      - name: Export Android APK
        shell: bash
        run: |
          set -e
          OUT="$PWD/dist/fenglinggu_${GAME_VERSION}.apk"
          "$GODOT_BIN" --headless --path "$PWD/game" --export-release "Android" "$OUT"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-android-${{ env.GAME_VERSION }}
          path: dist/
          if-no-files-found: error

  ios-xcodeproj:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        shell: bash
        run: |
          set -e
          mkdir -p "$PWD/dist/ios"
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}/"
      - name: Export iOS Xcode project
        shell: bash
        run: |
          OUT="$PWD/dist/ios/fenglinggu.xcodeproj"
          mkdir -p "$PWD/dist/ios"
          # Godot 可能顺带 xcodebuild archive；失败也要留下 xcodeproj
          "$GODOT_BIN" --headless --path "$PWD/game" --export-release "iOS" "$OUT" || echo "godot export exit=$?"
          if [ -e "$OUT" ]; then
            (cd "$PWD/dist/ios" && zip -qr "../fenglinggu_ios_${GAME_VERSION}_xcode.zip" .)
            echo "xcodeproj packaged"
          else
            echo "xcodeproj missing, listing game dir:"; ls -la "$PWD/game" | head
          fi
          # 尝试无签名 IPA（自签用骨架）
          if [ -e "$OUT" ]; then
            xcodebuild -project "$OUT" -scheme fenglinggu -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/dist/ios/fenglinggu.xcarchive" \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              archive || echo "archive unsigned skipped"
            if [ -d "$PWD/dist/ios/fenglinggu.xcarchive" ]; then
              mkdir -p "$PWD/dist/ios/Payload"
              APP=$(find "$PWD/dist/ios/fenglinggu.xcarchive/Products" -name '*.app' | head -1)
              if [ -n "$APP" ]; then
                cp -R "$APP" "$PWD/dist/ios/Payload/"
                (cd "$PWD/dist/ios" && zip -qr "../fenglinggu_${GAME_VERSION}_unsigned.ipa" Payload)
                echo "unsigned ipa packaged"
              fi
            fi
          fi
          ls -lh "$PWD/dist" || true
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-ios-${{ env.GAME_VERSION }}-xcode
          path: dist/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        shell: bash
        run: |
          set -e
          mkdir -p "$PWD/dist"
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot.app/Contents/MacOS/Godot"
          echo "GODOT_BIN=$GODOT_BIN" >> $GITHUB_ENV
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}"
          curl -L -o /tmp/tpl.tpz "$TPL_URL"
          unzip -qo /tmp/tpl.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/Library/Application Support/Godot/export_templates/${TPL_VER}/"
      - name: Export macOS
        shell: bash
        run: |
          set -e
          OUT="$PWD/dist/fenglinggu_${GAME_VERSION}.zip"
          "$GODOT_BIN" --headless --path "$PWD/game" --export-release "macOS" "$OUT"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fenglinggu-macos-${{ env.GAME_VERSION }}
          path: dist/
          if-no-files-found: ignore
